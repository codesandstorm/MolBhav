name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the guard reads every commit in the PR or push range
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Repository guard (commit messages, tracked paths, file sizes)
        run: node scripts/guard-git.mjs ci --range "$BASE..$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit and property tests
        run: npm test
      - name: Hand-verified examples
        run: npm run test:hand
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/app
      - name: App end-to-end (privacy, storage, accessibility)
        run: npm run test:e2e -w apps/app
      - name: Site build, hero tests and performance budget
        run: npm run test:e2e -w apps/site
